services:
  # --- Redis Service ---
  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend_network

  # --- Database Service ---
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    networks:
      - backend_network

  # --- Main Django Application (Scaled via Replicas) ---
  app_main:
    build: .
    # Optimized Gunicorn: 4 Workers per container, 2 threads each. 
    # This prevents GIL lockups during heavy password hashing.
    command: gunicorn e_commerce.wsgi:application --workers 4 --threads 2 --worker-class gthread --bind 0.0.0.0:8000 --timeout 60 --keep-alive 2 --max-requests 1000 --max-requests-jitter 50
    deploy:
      replicas: 3  # Automatically spins up 3 load-balanced copies
      resources:
        limits:
          cpus: '2.0'      # Increased CPU limit to handle hashing bursts
          memory: 1.5G 
        reservations:
          cpus: '0.5'
          memory: 512M
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    depends_on:
      - db
      - redis
    networks:
      - backend_network

  # --- Nginx Load Balancer ---
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/mediafiles:ro
    depends_on:
      - app_main
    networks:
      - backend_network

  # --- Locust Stress Tester ---
  locust:
    build: .
    command: locust -f ./e_commerce/locustfile.py --host=http://nginx:80
    ports:
      - "8089:8089"
    volumes:
      - .:/app
    depends_on:
      - nginx
    networks:
      - backend_network

# --- Network Definitions ---
networks:
  backend_network:
    driver: bridge

# --- Volume Definitions ---
volumes:
  postgres_data:
  static_volume:
  media_volume: