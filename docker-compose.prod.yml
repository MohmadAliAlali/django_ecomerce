version: '3.8'

services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - backend_network

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=200'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    networks:
      - backend_network

  app_main:
    build: .
    command: gunicorn e_commerce.wsgi:application --workers 4 --threads 4 --worker-class gthread --bind 0.0.0.0:8000 --timeout 30 --keep-alive 2 --max-requests 1000 --max-requests-jitter 50
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: e_commerce.settings.docker
      NODE_ID: app_main
      SERVER_TIER: SMALL
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    networks:
      - backend_network

  app_worker_1:
    build: .
    command: gunicorn e_commerce.wsgi:application --workers 4 --threads 4 --worker-class gthread --bind 0.0.0.0:8000 --timeout 30 --keep-alive 2 --max-requests 1000 --max-requests-jitter 50
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: e_commerce.settings.docker
      NODE_ID: app_worker_1
      SERVER_TIER: MEDIUM
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    networks:
      - backend_network

  app_worker_2:
    build: .
    command: gunicorn e_commerce.wsgi:application --workers 2 --threads 100 --worker-class gthread --bind 0.0.0.0:8000 --timeout 30 --keep-alive 2 --max-requests 1000 --max-requests-jitter 50
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/mediafiles
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: e_commerce.settings.docker
      NODE_ID: app_worker_2
      SERVER_TIER: MONSTER
      REDIS_HOST: redis
    depends_on:
      - db
      - redis
    networks:
      - backend_network

  decision-cache:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./scripts:/app/scripts:ro
      - routing_cache:/var/cache/routing
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    command:
      [
        "sh",
        "-c",
        "pip install -q redis && python3 /app/scripts/decision_cache_service.py",
        "--config",
        "/app/scripts/servers.django.json",
        "--host",
        "0.0.0.0",
        "--port",
        "8099",
        "--interval",
        "3",
        "--cache-file",
        "/var/cache/routing/routing_cache.json",
        "--compact-cache-file",
        "/var/cache/routing/routing_compact.json",
        "--edge-choices",
        "2",
      ]
    depends_on:
      - redis
      - app_main
      - app_worker_1
      - app_worker_2
    expose:
      - "8099"
    networks:
      - backend_network

  openresty:
    build:
      context: .
      dockerfile: Dockerfile.openresty
    ports:
      - "8088:80"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LB_LIVE_PULL_INTERVAL_SEC: "0.3"
      LB_MAX_ACTIVE_REQUESTS: "64"
      LB_TARGET_RESPONSE_TIME_MS: "200"
      LB_AFFINITY_BONUS_MATCH: "0.4"
      LB_AFFINITY_BONUS_MISMATCH: "-0.2"
      LB_FALLBACK_SCORE_THRESHOLD: "1.5"
      LB_CB_FAIL_THRESHOLD: "3"
      LB_CB_OPEN_SECONDS: "10"
      LB_CB_MAX_OPEN_SECONDS: "120"
      LB_CB_CANARY_RATE: "0.01"
    volumes:
      - routing_cache:/var/cache/routing:ro
    depends_on:
      - redis
      - decision-cache
      - app_main
      - app_worker_1
      - app_worker_2
    networks:
      - backend_network

  openresty-rr:
    build:
      context: .
      dockerfile: Dockerfile.openresty-rr
    ports:
      - "8090:80"
    depends_on:
      - app_main
      - app_worker_1
      - app_worker_2
    networks:
      - backend_network

  locust:
    build: .
    command: locust -f ./e_commerce/locustfile.py --host=http://openresty:80
    ports:
      - "8089:8089"
    volumes:
      - .:/app
    depends_on:
      - openresty
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge

volumes:
  postgres_data:
  static_volume:
  media_volume:
  routing_cache:
