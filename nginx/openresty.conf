worker_processes auto;
error_log stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include /usr/local/openresty/nginx/conf/mime.types;
	default_type application/octet-stream;

	resolver 127.0.0.11 ipv6=off valid=10s;

	lua_package_path "/usr/local/openresty/lualib/?.lua;;";
	lua_shared_dict lb_live_cache 10m;
	lua_shared_dict lb_circuit_breaker 2m;

	init_worker_by_lua_block {
		local routing = require "routing_state"
		routing.init(
			"/var/cache/routing/routing_compact.json",
			1,
			ngx.shared.lb_live_cache,
			ngx.shared.lb_circuit_breaker,
			tonumber(os.getenv("LB_LIVE_PULL_INTERVAL_SEC")) or 0.3
		)
	}

	server {
		listen 80;

		set $target_upstream "";

		location / {
			access_by_lua_block {
				local routing = require "routing_state"
				local load = routing.resolve_route(ngx.var.uri)
				ngx.req.set_header("X-Compute-Units", tostring(load))
				ngx.var.target_upstream = routing.resolve_affinity(ngx.var.uri)
			}

			proxy_pass $target_upstream;
			proxy_connect_timeout 2s;
			proxy_read_timeout 120s;
			proxy_send_timeout 120s;
			proxy_next_upstream off;

			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;

			log_by_lua_block {
				local cb = require "circuit_breaker"
				local inflight = require "edge_local_inflight"
				local node_id = ngx.ctx.lb_node_id
				if node_id then
					inflight.on_complete(node_id)
				end
				if not node_id then
					return
				end
				if ngx.status >= 500 then
					cb.record_failure(node_id)
				elseif ngx.status < 500 then
					cb.record_success(node_id)
				end
			}
		}
	}
}
